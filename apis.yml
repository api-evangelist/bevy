aid: bevy
name: Bevy
description: >-
  Bevy is an enterprise community engagement platform that unifies forums, events,
  groups, gamification, and analytics into a single hub for building branded
  customer and developer communities. It layers AI agents (a Community Knowledge
  Agent and an Engagement Agent Hub) on top of that surface to automate member
  interactions and reduce manual work, and ties real-time analytics and ROI
  dashboards back to business impact through CRM integrations with HubSpot,
  Salesforce, and Marketo. Bevy also powers virtual and in-person events and
  maintains CMX, the community-professionals network. Customers include Twitch,
  Salesforce, Adobe, Atlassian, Notion, and Etsy. Bevy exposes a REST API rooted
  at www.bevy.com/api for programmatic access to the platform, with the reference
  hosted in its customer help center. The company is backed by Accel.
